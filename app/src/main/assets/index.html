<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Les Tréfonds d'Internet</title>
<style>
/* Version 2 : léger et rapide (pas de flou, pas d'animation en boucle), 2 grandes catégories */
:root{--bg:#0b0b14;--bg2:#12121f;--card:#171728;--card2:#1e1e33;--line:#2a2a44;--ink:#f3f4ff;--mute:#9b9dc0;--acc:#22d3ee;--acc2:#a855f7;--gold:#fbbf24;--epi:#a855f7;--rar:#3b82f6;--com:#64748b;--ok:#22c55e;--warn:#f59e0b;--bad:#ef4444}
body[data-o=offres]{--bg:#fff7f0;--bg2:#ffffff;--card:#ffffff;--card2:#fff1e6;--line:#f1dfd2;--ink:#2a1a14;--mute:#8a6f63;--soft:#5b463d;--acc:#f97316;--acc2:#e11d48;background:var(--bg)}
body{--soft:#d6d8f5}
body[data-o=favoris]{--acc:#f472b6;--acc2:#fb7185}
[hidden]{display:none!important}
*{box-sizing:border-box;min-width:0;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.4 system-ui,Roboto,sans-serif}
body{padding-bottom:76px}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
.haut{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
.l1{display:flex;align-items:center;gap:10px;padding:12px 14px 8px}
.l1 h1{margin:0;font-size:20px;font-weight:900;flex:1;line-height:1.1}
.l1 h1 span{color:var(--acc)}
.l1 .maj{display:block;font-size:11px;color:var(--mute);font-weight:500;margin-top:2px}
.ico{width:42px;height:42px;border-radius:12px;border:1px solid var(--line);background:var(--card);display:grid;place-items:center;position:relative;flex:none}
.ico svg{width:20px;height:20px}
.ico.tourne svg{animation:tour .8s linear infinite}
@keyframes tour{to{transform:rotate(360deg)}}
.ico .nb{position:absolute;top:-5px;right:-5px;background:var(--acc);color:#000;font-size:10px;font-weight:900;border-radius:9px;min-width:18px;height:18px;display:grid;place-items:center;padding:0 4px}
.l2{display:flex;gap:8px;padding:0 14px 8px}
.rech{flex:1;display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:0 12px;height:42px}
.rech input{flex:1;border:0;background:none;outline:none;font-size:16px}
.rech svg{width:18px;height:18px;color:var(--mute);flex:none}
.chips{display:flex;gap:6px;overflow-x:auto;padding:0 14px 10px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;height:34px;padding:0 12px;border-radius:10px;border:1px solid var(--line);background:var(--card);font-size:13px;font-weight:600;white-space:nowrap;display:flex;align-items:center;gap:5px}
.chip i{font-style:normal;color:var(--mute);font-size:12px}
.chip.on{background:var(--acc);border-color:var(--acc);color:#000}
.chip.on i{color:#000;opacity:.6}
.chip.a.on{background:var(--ac);border-color:var(--ac)}
.grp{display:flex;gap:10px;align-items:flex-start;margin:18px 0 8px;padding:10px 12px;border-radius:12px;background:color-mix(in srgb,var(--ac) 12%,transparent);border-left:4px solid var(--ac)}
.grp b{display:block;font-size:15px}
.grp small{color:var(--mute);font-size:12px}
.grp .n{margin-left:auto;font-weight:900;color:var(--ac)}
.b.a{background:var(--ac);color:#06060c}
main{padding:12px 14px}
.resume{display:flex;justify-content:space-between;align-items:center;font-size:13px;color:var(--mute);margin:0 0 10px}
.resume b{color:var(--ink)}
.resume select{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:6px 8px;font-size:13px}
.actifs{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 10px}
.actifs button{border:0;background:color-mix(in srgb,var(--acc) 18%,transparent);color:var(--acc);border-radius:8px;padding:5px 9px;font-size:12px;font-weight:700}
h2.sec{font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--mute);margin:16px 0 8px;font-weight:800}
.top{display:flex;gap:10px;overflow-x:auto;margin:0 -14px;padding:0 14px 4px;scrollbar-width:none}
.top::-webkit-scrollbar{display:none}
.tc{flex:0 0 72%;max-width:300px;border-radius:16px;padding:14px;background:linear-gradient(160deg,color-mix(in srgb,var(--pc) 38%,var(--card)),var(--card) 80%);border:1px solid color-mix(in srgb,var(--rc) 70%,transparent)}
.tc.r-leg{box-shadow:0 0 0 1px var(--gold) inset}
.tc .rg{font-size:11px;font-weight:900;color:var(--rc);letter-spacing:.05em}
.tc h3{margin:6px 0 4px;font-size:17px;line-height:1.2;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.tc .mt{font-size:12px;color:var(--soft);display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.liste{display:flex;flex-direction:column;gap:8px}
.it{display:flex;gap:12px;align-items:center;padding:10px;border-radius:14px;background:var(--card);border:1px solid var(--line);position:relative}
.it::before{content:"";position:absolute;left:0;top:10px;bottom:10px;width:3px;border-radius:0 3px 3px 0;background:var(--rc)}
.it.vu{opacity:.5}
.r-leg{--rc:var(--gold)}.r-epi{--rc:var(--epi)}.r-rar{--rc:var(--rar)}.r-com{--rc:var(--com)}
.av{flex:none;width:48px;height:48px;border-radius:12px;display:grid;place-items:center;font-size:24px;background:color-mix(in srgb,var(--pc) 28%,var(--card2));color:#fff;font-weight:900}
.av.txt{font-size:12px;letter-spacing:.02em}
.ct{flex:1}
.ct h3{margin:0;font-size:15px;line-height:1.25;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.mt{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-top:4px;font-size:12px;color:var(--mute)}
.b{font-size:10.5px;font-weight:800;padding:2px 6px;border-radius:6px;white-space:nowrap}
.b.g{background:var(--ok);color:#03140a}
.b.c{background:color-mix(in srgb,var(--warn) 22%,transparent);color:var(--warn)}
.b.n{background:var(--acc2);color:#fff}
.b.r{color:var(--rc);border:1px solid color-mix(in srgb,var(--rc) 60%,transparent)}
.urg{color:var(--bad);font-weight:700}
.dr{flex:none;display:flex;flex-direction:column;align-items:flex-end;gap:6px}
.px{font-weight:900;font-size:13px;padding:4px 8px;border-radius:8px;background:#15803d;color:#fff;white-space:nowrap}
.px.p{background:#b45309;color:#fff}
.px.ab{background:#e11d48;color:#fff}
.px s{opacity:.6;font-weight:500;margin-right:4px}
.fav{border:0;background:none;padding:2px;font-size:18px;line-height:1;opacity:.85}
.plus{display:block;width:100%;margin-top:10px;height:44px;border-radius:12px;border:1px dashed var(--line);background:none;color:var(--mute);font-weight:700}
.vide{text-align:center;color:var(--mute);padding:36px 16px;border:1px dashed var(--line);border-radius:16px}
.vide b{display:block;color:var(--ink);font-size:16px;margin-bottom:4px}
/* Offres : tuiles façon appli de courses */
.grille{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
@media(min-width:700px){.grille{grid-template-columns:repeat(4,minmax(0,1fr))}}
.tu{position:relative;display:flex;flex-direction:column;border-radius:18px;background:var(--card);border:1px solid var(--line);overflow:hidden;box-shadow:0 2px 0 var(--line)}
.tu.vu{opacity:.55}
.tu .im{height:86px;display:grid;place-items:center;font-size:44px;background:color-mix(in srgb,var(--pc) 22%,var(--card));border-bottom:3px solid var(--rc)}
.tu .co{padding:9px 10px 10px;display:flex;flex-direction:column;gap:6px;flex:1}
.tu h3{margin:0;font-size:13.5px;line-height:1.25;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:34px}
.tu .ry{font-size:11px;color:var(--mute)}
.tu .bas2{display:flex;align-items:center;justify-content:space-between;gap:6px;margin-top:auto}
.tu .fav{position:absolute;top:6px;right:6px;background:var(--card);border-radius:50%;width:30px;height:30px;display:grid;place-items:center;font-size:15px}
.tu .b{align-self:flex-start}
.alerte{border-radius:14px;padding:12px 14px;margin:10px 0;background:#fff1f2;color:#881337;border:2px solid #f43f5e}
.alerte b{display:block;font-size:16px;margin-bottom:4px}
.alerte p{margin:3px 0;font-size:14px}
.rap{display:block;width:100%;height:48px;border:0;border-radius:12px;background:#e11d48;color:#fff;font-weight:900;font-size:15px;margin-top:8px}
nav.bas{position:fixed;left:0;right:0;bottom:0;z-index:6;display:grid;grid-template-columns:repeat(5,1fr);background:var(--bg2);border-top:1px solid var(--line);padding:6px 6px calc(6px + env(safe-area-inset-bottom))}
nav.bas button{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0;border-radius:12px;font-size:11px;font-weight:700;color:var(--mute);position:relative}
nav.bas svg{width:23px;height:23px}
nav.bas button.on{color:var(--acc);background:color-mix(in srgb,var(--acc) 12%,transparent)}
nav.bas .nb{position:absolute;top:2px;left:calc(50% + 6px);background:var(--acc2);color:#fff;font-size:10px;font-weight:900;min-width:17px;height:17px;border-radius:9px;display:grid;place-items:center;padding:0 4px}
.voile{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:8;display:none}
.voile.on{display:block}
.feuille{position:fixed;left:0;right:0;bottom:0;z-index:9;max-height:90vh;overflow-y:auto;background:var(--bg2);border-radius:20px 20px 0 0;border-top:2px solid var(--acc);padding:8px 16px calc(20px + env(safe-area-inset-bottom));display:none}
.feuille.on{display:block}
.poi{width:40px;height:4px;border-radius:2px;background:var(--line);margin:4px auto 10px}
.feuille h2{margin:6px 0 6px;font-size:21px;line-height:1.2}
.feuille .d{color:var(--soft);margin:0 0 10px}
.bl{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 12px;margin:8px 0}
.bl h4{margin:0 0 6px;font-size:13px}
.bl ul,.bl ol{margin:0;padding-left:18px}.bl li{margin:3px 0}
.inf{display:grid;grid-template-columns:auto 1fr;gap:5px 12px;font-size:13px;margin:0}
.inf dt{color:var(--mute)}.inf dd{margin:0;font-weight:600}
.go{display:block;width:100%;height:52px;border:0;border-radius:14px;font-size:17px;font-weight:900;background:var(--acc);color:#000;margin-top:12px}
.sec2{display:block;width:100%;height:46px;border:1px solid var(--line);border-radius:14px;background:var(--card);font-weight:700;margin-top:8px}
.rang{display:flex;gap:8px}
.rang>*{flex:1}
.fgrp{margin:12px 0}
.fgrp>b{display:block;font-size:12px;color:var(--mute);text-transform:uppercase;letter-spacing:.06em;margin-bottom:6px}
.fgrp .wrap{display:flex;flex-wrap:wrap;gap:6px}
.ligne{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 0;border-top:1px solid var(--line)}
.ligne:first-of-type{border-top:0}
.ligne small{display:block;color:var(--mute);font-size:12px}
.sw{position:relative;width:46px;height:28px;flex:none}
.sw input{position:absolute;inset:0;opacity:0;margin:0;z-index:1}
.sw span{position:absolute;inset:0;border-radius:14px;background:var(--line)}
.sw span::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:transform .15s}
.sw input:checked+span{background:var(--acc)}
.sw input:checked+span::after{transform:translateX(18px)}
.reg{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:4px 14px;margin:0 0 12px}
.reg h3{margin:10px 0 2px;font-size:15px}
.reg select,.reg input[type=time]{background:var(--bg2);border:1px solid var(--line);border-radius:10px;padding:8px;font-size:15px}
.note{font-size:13px;color:var(--mute);padding:8px 0 10px}
.coul{display:flex;gap:10px;flex-wrap:wrap;padding:10px 0}
.coul button{width:38px;height:38px;border-radius:50%;border:3px solid transparent}
.coul button.on{border-color:#fff}
.toast{position:fixed;left:50%;bottom:86px;transform:translateX(-50%);background:#fff;color:#000;font-weight:700;padding:9px 14px;border-radius:10px;z-index:10;display:none;white-space:nowrap}
.toast.on{display:block}
/* Style « tréfonds » : titre dégradé, lueur venue des profondeurs */
#titre .t2{background:linear-gradient(90deg,var(--acc),var(--acc2));-webkit-background-clip:text;background-clip:text;color:transparent}
body[data-o=jeux],body[data-o=favoris],body[data-o=reglages]{background:radial-gradient(130% 55% at 50% -8%,color-mix(in srgb,var(--acc2) 26%,var(--bg)) 0%,var(--bg) 62%) fixed var(--bg)}
body[data-o=jeux] .haut,body[data-o=favoris] .haut,body[data-o=reglages] .haut{background:color-mix(in srgb,var(--bg) 92%,transparent)}
.it{transition:transform .08s}.it:active,.tu:active,.colis:active{transform:scale(.985)}
/* Mes commandes : style carton / colis */
body[data-o=commandes]{--bg:#f3eadb;--bg2:#fffaf1;--card:#fffdf8;--card2:#efe2cc;--line:#e0cfb4;--ink:#2b2118;--mute:#86725d;--soft:#5c4a39;--acc:#16a34a;--acc2:#0ea5e9;background:repeating-linear-gradient(135deg,#f3eadb 0 22px,#f0e6d5 22px 44px) fixed}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:4px 0 12px}
.stats div{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 6px;text-align:center}
.stats b{display:block;font-size:22px;font-weight:900}
.stats small{font-size:11px;color:var(--mute);font-weight:700}
.stats .eco b{color:var(--acc)}
.colis{position:relative;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px 12px 10px;box-shadow:0 3px 0 var(--line);overflow:hidden}
.colis::before{content:"";position:absolute;top:0;bottom:0;left:50%;width:34px;margin-left:-17px;background:color-mix(in srgb,#c8a36a 22%,transparent);pointer-events:none}
.colis.e2{background:color-mix(in srgb,var(--acc) 7%,var(--card))}
.colis.e2::before{background:color-mix(in srgb,var(--acc) 14%,transparent)}
.colis .hd{position:relative;display:flex;gap:10px;align-items:center}
.colis .em{flex:none;width:46px;height:46px;border-radius:12px;display:grid;place-items:center;font-size:24px;background:var(--card2)}
.colis h3{margin:0;font-size:15px;line-height:1.25;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.colis .sb{font-size:12px;color:var(--mute);margin-top:2px}
.ok{flex:none;width:46px;height:46px;border-radius:50%;border:2.5px dashed var(--mute);background:var(--card);font-size:22px;font-weight:900;color:transparent;display:grid;place-items:center}
.ok.on{border:0;background:var(--acc);color:#fff}
.etapes{position:relative;display:grid;grid-template-columns:repeat(3,1fr);margin:12px 0 4px}
.etapes::before{content:"";position:absolute;top:11px;left:16%;right:16%;height:4px;border-radius:2px;background:var(--line)}
.etapes .bar{position:absolute;top:11px;left:16%;height:4px;border-radius:2px;background:var(--acc)}
.etapes button{position:relative;border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:11px;font-weight:700;color:var(--mute);padding:0}
.etapes button i{width:26px;height:26px;border-radius:50%;background:var(--card);border:3px solid var(--line);display:grid;place-items:center;font-style:normal;font-size:12px}
.etapes button.on{color:var(--ink)}
.etapes button.on i{background:var(--acc);border-color:var(--acc);color:#fff}
.avert{position:relative;margin:8px 0 0;padding:8px 10px;border-radius:10px;font-size:13px;font-weight:600;background:#fff7ed;color:#9a3412;border:1px solid #fdba74}
.avert.abo{background:#fff1f2;color:#9f1239;border-color:#fda4af}
.act{position:relative;display:flex;gap:6px;margin-top:10px;flex-wrap:wrap}
.act button{flex:1;min-width:0;height:36px;border-radius:10px;border:1px solid var(--line);background:var(--bg2);font-size:13px;font-weight:700;white-space:nowrap}
.champ{display:block;margin:10px 0}
.champ span{display:block;font-size:12px;font-weight:700;color:var(--mute);margin-bottom:4px}
.champ input,.champ textarea{width:100%;border:1px solid var(--line);border-radius:12px;background:var(--card);padding:11px 12px;font-size:16px;outline:none}
.champ textarea{min-height:70px;resize:vertical}
.cmdb{display:block;width:100%;height:48px;border-radius:14px;border:2px dashed var(--acc);background:color-mix(in srgb,var(--acc) 8%,transparent);color:var(--acc);font-weight:900;font-size:15px;margin:0 0 12px}
.dejacmd{display:block;text-align:center;margin-top:8px;font-size:13px;font-weight:700;color:var(--ok)}
</style>
</head>
<body data-o="jeux">
<div class="haut">
  <div class="l1">
    <h1 id="titre">Les Tréfonds <span class="t2">d'Internet</span><span class="maj" id="maj">Chargement…</span></h1>
    <button class="ico" id="btnMaj" aria-label="Actualiser"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M20 12a8 8 0 1 1-2.3-5.6M20 4v5h-5"/></svg></button>
  </div>
  <div class="l2" id="l2">
    <label class="rech"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg><input id="q" type="search" placeholder="Rechercher un jeu, un produit…" autocomplete="off"></label>
    <button class="ico" id="btnFiltres" aria-label="Filtres"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M4 6h16M7 12h10M10 18h4"/></svg><span class="nb" id="nbF" hidden></span></button>
  </div>
  <div class="chips" id="chipsA"></div>
  <div class="chips" id="chips"></div>
</div>

<div id="maj-appli" hidden style="margin:10px 14px 0;padding:12px 14px;border-radius:14px;background:linear-gradient(90deg,var(--acc),var(--acc2));color:#000;font-weight:800;display:flex;align-items:center;gap:10px"><span style="flex:1">🆕 Nouvelle version de l'appli disponible</span><button data-installer="1" style="border:0;border-radius:10px;background:#000;color:#fff;font-weight:800;padding:9px 12px">Mettre à jour</button></div>
<main id="vue"></main>

<nav class="bas" id="nav">
  <button data-t="jeux"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M7 7h10a5 5 0 0 1 0 10c-1.6 0-2.4-1-3.2-2h-3.6c-.8 1-1.6 2-3.2 2A5 5 0 0 1 7 7zm-.5 3v1.5H5V13h1.5v1.5H8V13h1.5v-1.5H8V10zm9.5 1a1 1 0 1 0 0 2 1 1 0 0 0 0-2zm2-1.5a1 1 0 1 0 0 2 1 1 0 0 0 0-2z"/></svg>Jeux vidéo<span class="nb" hidden></span></button>
  <button data-t="offres"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M4 9h16v3H4zm1 4h6v8H6a1 1 0 0 1-1-1zm8 0h6v7a1 1 0 0 1-1 1h-5zM11 9h2v12h-2zM12 8c-1.5-3-5-3.5-5-1.5S10 8 12 8zm0 0c1.5-3 5-3.5 5-1.5S14 8 12 8z"/></svg>Offres<span class="nb" hidden></span></button>
  <button data-t="commandes"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2 3 6.5v11L12 22l9-4.5v-11zm0 2.2 6.4 3.2L16 8.6 9.6 5.4zM7.4 6.5l6.4 3.2L12 10.6 5.6 7.4zM5 9l6 3v7.6l-6-3zm14 0v7.6l-6 3V12z"/></svg>Commandes<span class="nb" hidden></span></button>

/* Prépare les listes une seule fois par chargement (rapide) */
function preparer() {
  const now = Date.now();
  const prep = (arr, t) => (arr || []).filter(o => !o.fin || new Date(o.fin).getTime() > now).map(o => {
    const x = Object.assign({}, o);
    x._k = t + ':' + o.id; x._t = t;
    x._mob = t === 'jeux' && ['android', 'ios'].includes(o.plateforme);
    x._fin = o.fin ? new Date(o.fin).getTime() : null;
    x._s = norm([o.titre, o.desc, o.via, o.plateforme, o.rayon, o.genre, (o.tags || []).join(' '), o.finTxt].join(' '));
    x._fps = FPS.test(x._s);
    x._carte = !o.sansCarte && /carte|cb |iban|paiement/.test(norm((o.conditions || '') + ' ' + (o.pieges || []).join(' ')));
    x._cout = typeof o.coutNum === 'number' ? o.coutNum : (o.gratuit ? 0 : null);
    return x;
  }).sort((a, b) => ACC[accOf(a)].r - ACC[accOf(b)].r || (RANG[b.rarete] || 0) - (RANG[a.rarete] || 0) || (b.gratuit === true) - (a.gratuit === true) || (b.nouveau === true) - (a.nouveau === true) || (a._fin || 9e15) - (b._fin || 9e15));

  cache.tout = new Map([...cache.jeux, ...cache.offres].map(o => [o._k, o]));
}
function catDe(o) { return o._t === 'jeux' ? (o._mob ? 'mobile' : o.cat) : o.rayon; }

function filtrer(t) {
  const f = F[t], now = Date.now(), qq = norm(q.trim());
  let l = cache[t].filter(o =>
    (f.acces === 'tout' || accOf(o) === f.acces) &&
    (f.cat === 'tout' || catDe(o) === f.cat) &&
    (f.plat === 'tout' || o.plateforme === f.plat) &&
    (f.rar === 'tout' || RANG[o.rarete] >= RANG[f.rar]) &&
    (f.type === 'tout' || o.type === f.type) &&
    (!f.gratuit || o.gratuit) && (!f.nouveau || o.nouveau) && (!f.nonvu || !vus.has(o._k)) &&
    (!f.bientot || (o._fin && o._fin - now < 72 * 36e5)) && (!f.fps || o._fps) && (!f.sansCarte || !o._carte) &&
    (f.coutMax === 'tout' || (o._cout !== null && o._cout <= +f.coutMax)) &&
    (!qq || qq.split(/\s+/).every(w => o._s.includes(w))));
  if (f.tri === 'fin') l = [...l].sort((a, b) => (a._fin || 9e15) - (b._fin || 9e15));
  else if (f.tri === 'neuf') l = [...l].sort((a, b) => (b.nouveau === true) - (a.nouveau === true));
  else if (f.tri === 'az') l = [...l].sort((a, b) => String(a.titre).localeCompare(String(b.titre), 'fr'));
  return l;
}
function nbFiltres(t) { const f = F[t], d = F0(); return Object.keys(d).filter(k => k !== 'cat' && k !== 'tri' && k !== 'acces' && f[k] !== d[k]).length; }

function rebours(o) {
  if (o._fin) {
    const ms = o._fin - Date.now(), h = Math.floor(ms / 36e5), j = Math.floor(h / 24);
    const t = j >= 1 ? `${j} j ${h % 24} h` : h >= 1 ? `${h} h` : `${Math.max(1, Math.floor(ms / 6e4))} min`;
    return `<span class="${h < 48 ? 'urg' : ''}">⏳ ${t}</span>`;
  }
  return o.finTxt ? `<span>${esc(o.finTxt.length > 28 ? o.finTxt.slice(0, 27) + '…' : o.finTxt)}</span>` : '';
}
function coul(o) { return o._t === 'offres' ? (RAY[o.rayon]?.[2] || '#64748b') : (PLAT[o.plateforme]?.[1] || '#64748b'); }
function avatar(o) {
  if (o._t === 'offres') return `<div class="av" style="--pc:${coul(o)}">${esc(o.emoji || RAY[o.rayon]?.[1] || '🎁')}</div>`;

  return `<span class="px">${o.prix && !/gratuit/i.test(o.prix) ? `<s>${esc(o.prix)}</s>` : ''}0 €</span>`;
}
function ligne(o) {
  const sous = o._t === 'offres' ? (RAY[o.rayon]?.[0] || '') + (o.type && TYP[o.type] ? ' · ' + TYP[o.type] : '') : (PLAT[o.plateforme]?.[0] || '') + ' · ' + (CATJ[catDe(o)]?.[0] || '');
  return `<div class="it r-${o.rarete || 'com'}${vus.has(o._k) ? ' vu' : ''}" data-k="${esc(o._k)}">${avatar(o)}
    <div class="ct"><h3>${esc(o.titre)}</h3><div class="mt">${badgeAcc(o)}${o.nouveau && !vus.has(o._k) ? '<span class="b n">NOUVEAU</span>' : ''}${o.rarete && o.rarete !== 'com' ? `<span class="b r">${NOMR[o._t][o.rarete]}</span>` : ''}<span>${esc(sous)}</span>${rebours(o)}</div></div>

}
function tuile(o) {

}

function chips() {
  const el = $('#chips'), ea = $('#chipsA');
  if (onglet !== 'jeux' && onglet !== 'offres') { el.innerHTML = ''; ea.innerHTML = ''; return; }
  {
    const t = onglet, f = F[t], ca = {};
    for (const o of cache[t]) { const a = accOf(o); ca[a] = (ca[a] || 0) + 1; }
    let ha = `<button class="chip a${f.acces === 'tout' ? ' on' : ''}" style="--ac:var(--acc)" data-acc="tout">Tous les accès</button>`;
    for (const k in ACC) if (ca[k]) ha += `<button class="chip a${f.acces === k ? ' on' : ''}" style="--ac:${ACC[k].c}" data-acc="${k}">${ACC[k].i} ${ACC[k][t][0]} <i>${ca[k]}</i></button>`;
    ea.innerHTML = ha;
  }
  const t = onglet, f = F[t], src = cache[t];
  const cats = t === 'jeux' ? CATJ : RAY;
  const cnt = {};
  for (const o of src) { const c = catDe(o); cnt[c] = (cnt[c] || 0) + 1; }
  let h = `<button class="chip${f.cat === 'tout' ? ' on' : ''}" data-cat="tout">Tout <i>${src.length}</i></button>`;
  for (const k in cats) if (cnt[k]) h += `<button class="chip${f.cat === k ? ' on' : ''}" data-cat="${k}">${cats[k][1]} ${cats[k][0]} <i>${cnt[k]}</i></button>`;
  el.innerHTML = h;
}
function vueListe(t) {
  const l = filtrer(t), f = F[t];
  const tops = (f.cat === 'tout' && !q && nbFiltres(t) === 0) ? cache[t].filter(o => o.cat !== 'avenir' && accOf(o) === 'direct' && (o.rarete === 'leg' || o.rarete === 'epi')).slice(0, 8) : [];
  const actifs = [];
  const lab = {plat: v => PLAT[v]?.[0] || v, rar: v => 'Min. ' + NOMR[t][v], type: v => TYP[v] || v, gratuit: () => 'Sûr et gratuit', nouveau: () => 'Nouveau', bientot: () => 'Finit < 3 j', nonvu: () => 'Pas encore vu', fps: () => 'FPS / multi', sansCarte: () => 'Sans carte', coutMax: v => '≤ ' + v + ' €'};
  const d = F0();
  for (const k in lab) if (f[k] !== d[k]) actifs.push(`<button data-raz="${k}">${esc(lab[k](f[k]))} ✕</button>`);
  let h = `<div class="resume"><span><b>${l.length}</b> offre${l.length > 1 ? 's' : ''}${q ? ` pour « ${esc(q)} »` : ''}</span><select id="tri" aria-label="Trier"><option value="reco"${f.tri === 'reco' ? ' selected' : ''}>Les meilleures d'abord</option><option value="fin"${f.tri === 'fin' ? ' selected' : ''}>Finit bientôt</option><option value="neuf"${f.tri === 'neuf' ? ' selected' : ''}>Nouveautés</option><option value="az"${f.tri === 'az' ? ' selected' : ''}>A → Z</option></select></div>`;
  if (actifs.length) h += `<div class="actifs">${actifs.join('')}<button data-raz="tout">Tout effacer</button></div>`;

  else if (!l.length) h += `<div class="vide"><b>Rien avec ces filtres</b>Essaie d'en enlever un.</div>`;
  else if (f.acces === 'tout' && f.tri === 'reco') {
    let n = 0, cur = null;
    const parts = [];
    for (const o of l.slice(0, montres)) {

      if (a !== cur) { if (cur) parts.push('</div>'); cur = a; const nbA = l.filter(x => accOf(x) === a).length; parts.push(`<div class="grp" style="--ac:${ACC[a].c}"><div><b>${ACC[a].i} ${ACC[a][t][0]}</b><small>${ACC[a][t][1]}</small></div><span class="n">${nbA}</span></div><div class="${boite(t)}">`); }

  return h;
}
function vueFavoris() {

    const n = +(((await r.json()).body || '').match(/Version (\d+)/) || [])[1];
    const neuf = !!(n && n > window.Android.versionApp());
    $('#maj-appli').hidden = !neuf;
    return neuf ? n : 0;
  } catch (e) { return 0; }
}
function proposerMaj(n) {
  $('#feuille').innerHTML = `<div class="poi"></div><h2>🆕 Nouvelle version de l'appli</h2>
    <p class="d">Les offres sont à jour ✓ et une nouvelle version de l'appli est prête (n° ${n}). Elle s'installe par-dessus : tu ne perds ni tes favoris, ni tes commandes, ni tes réglages.</p>
    <button class="go" data-installer="1">Installer maintenant</button><button class="sec2" id="fermer">Plus tard</button>`;
  ouvrirFeuille();
}
function installerMaj() {
  if (AND && window.Android.installerMaj) { window.Android.installerMaj(); toast('Téléchargement de la nouvelle version…'); }
  else lien('https://github.com/Skuff6/mes-gratuits/releases/download/appli/mes-gratuits.apk');
}
window.ouvrirOnglet = t => { if (t === 'dlc') t = 'jeux'; if (t === 'produits') t = 'offres'; onglet = t; montres = PAS; history.replaceState(null, '', '#' + t); $('#feuille').classList.remove('on'); $('#voile').classList.remove('on'); rendre(); window.scrollTo(0, 0); };
window.actualiser = actualiser;
window.retour = () => {
  if ($('#feuille').classList.contains('on')) { fermer(); return true; }
  if (q) { q = ''; $('#q').value = ''; rendre(); return true; }
  if (onglet !== 'jeux') { window.ouvrirOnglet('jeux'); return true; }
  return false;
};

document.addEventListener('click', e => {
  const g = s => e.target.closest(s);
  let el;
  if ((el = g('#nav button'))) return window.ouvrirOnglet(el.dataset.t);
  if ((el = g('[data-fav]'))) { const k = el.dataset.fav; if (favs[k]) delete favs[k]; else favs[k] = 1; lsSet('mg-favs', favs); toast(favs[k] ? 'Ajouté aux favoris ❤️' : 'Retiré des favoris'); if ($('#feuille').classList.contains('on')) fiche(k); else rendre(); return; }
  if ((el = g('[data-rappel]'))) return programmerRappel(el.dataset.rappel);
  if (g('[data-installer]')) return installerMaj();
  if ((el = g('[data-cmd]'))) { ajouterCmd(el.dataset.cmd); fiche(el.dataset.cmd); return; }
  if ((el = g('[data-recu]'))) { const c = cmds.find(x => x.id === el.dataset.recu); if (c) etatCmd(c.id, c.etat === 2 ? 1 : 2); return; }
  if ((el = g('[data-etat]'))) { const [id, e2] = el.dataset.etat.split(':'); return etatCmd(id, +e2); }
  if ((el = g('[data-suivi]'))) return suivreCmd(el.dataset.suivi);
  if ((el = g('[data-editcmd]'))) return ficheCmd(el.dataset.editcmd);
  if ((el = g('[data-savecmd]'))) return enregistrerCmd(el.dataset.savecmd);
  if ((el = g('[data-delcmd]'))) { cmds = cmds.filter(x => x.id !== el.dataset.delcmd); sauverCmd(); fermer(); toast('Supprimé'); return; }
  if ((el = g('[data-cmdf]'))) { cmdF = el.dataset.cmdf; rendre(); return; }
  if ((el = g('[data-lien]'))) return lien(el.dataset.lien);
  if ((el = g('[data-k]'))) return fiche(el.dataset.k);
  if ((el = g('[data-acc]'))) { F[onglet].acces = el.dataset.acc; montres = PAS; sauverF(); rendre(); window.scrollTo(0, 0); return; }
  if ((el = g('[data-cat]'))) { F[onglet].cat = el.dataset.cat; montres = PAS; sauverF(); rendre(); return; }
  if ((el = g('[data-fk]'))) { F[onglet][el.dataset.fk] = el.dataset.fv; montres = PAS; sauverF(); $('#feuille').innerHTML = vueFiltres(); return; }
  if ((el = g('[data-raz]'))) { const k = el.dataset.raz, d = F0(); if (k === 'tout') { const c = F[onglet].cat, tr = F[onglet].tri; F[onglet] = Object.assign(d, {cat: c, tri: tr}); } else F[onglet][k] = d[k]; sauverF(); if ($('#feuille').classList.contains('on')) $('#feuille').innerHTML = vueFiltres(); else rendre(); return; }
  if ((el = g('[data-c]'))) { R.accent = +el.dataset.c; sauver(); accent(); rendre(); return; }
  if (g('#btnFiltres')) { $('#feuille').innerHTML = vueFiltres(); ouvrirFeuille(); return; }
  if (g('#fermer') || e.target.id === 'voile') return fermer();
  if (g('#plus')) { montres += PAS; rendre(); return; }
  if (g('#btnMaj')) return actualiser(true);
  if (g('#test')) { if (AND) { window.Android.testerNotif(); toast('Notification envoyée'); } else toast('Marche dans l\'appli du téléphone'); return; }
  if (g('#raz')) { vus = new Set(); lsSet('mg-vus', []); toast('Remis à zéro'); rendre(); return; }
  if (g('#nettoyer')) { for (const k in favs) if (!cache.tout.get(k)) delete favs[k]; lsSet('mg-favs', favs); rendre(); }
});
document.addEventListener('change', e => {
  const t = e.target;
  if (t.dataset.fb) { F[onglet][t.dataset.fb] = t.checked; montres = PAS; sauverF(); $('#feuille').innerHTML = vueFiltres(); }
  else if (t.id === 'tri') { F[onglet].tri = t.value; sauverF(); rendre(); }
  else if (t.dataset.r) { R[t.dataset.r] = t.checked; sauver(); toast('Enregistré ✓'); }
  else if (t.id === 'heure') { R.heure = t.value || '13:30'; sauver(); toast('Notification à ' + R.heure.replace(':', ' h ')); }
  else if (t.id === 'nRarete') { R.nRarete = t.value; sauver(); toast('Enregistré ✓'); }
});
let tq;
$('#q').addEventListener('input', e => { clearTimeout(tq); tq = setTimeout(() => { q = e.target.value; montres = PAS; $('#vue').innerHTML = vueListe(onglet); }, 180); });
document.addEventListener('visibilitychange', () => { if (!document.hidden) actualiser(false); });

if (!['jeux', 'offres', 'commandes', 'favoris', 'reglages'].includes(onglet)) onglet = 'jeux';
accent();
preparer();
rendre();
envoyerNotif();
actualiser(false);
}
</script>
</body>
