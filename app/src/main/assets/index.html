<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mes gratuits</title>
<style>
:root{--acc:#00f0ff;--acc2:#ff2bd6;--bg:#07070f;--bg2:#0f0f1d;--card:#141428;--line:#24244a;--ink:#f2f3ff;--mute:#9a9cc4;--gold:#ffc93c;--epi:#b56cff;--rar:#3fa9ff;--com:#6b6f99;--ok:#2ef59a}
*{box-sizing:border-box;min-width:0;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 system-ui,Roboto,sans-serif;overscroll-behavior-y:contain}
body{padding-bottom:84px;background:radial-gradient(120% 60% at 100% 0,color-mix(in srgb,var(--acc2) 14%,transparent),transparent 60%),radial-gradient(90% 50% at 0 0,color-mix(in srgb,var(--acc) 12%,transparent),transparent 60%),var(--bg);background-attachment:fixed;min-height:100vh}
button,input,select{font:inherit;color:inherit}
.top{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:12px;padding:14px 16px 10px;background:linear-gradient(var(--bg) 70%,transparent)}
.logo{width:42px;height:42px;flex:none;filter:drop-shadow(0 0 10px color-mix(in srgb,var(--acc) 60%,transparent))}
.top h1{margin:0;font-size:22px;font-weight:900;letter-spacing:.3px;line-height:1.1}
.top h1 b{color:var(--acc);text-shadow:0 0 14px color-mix(in srgb,var(--acc) 70%,transparent)}
.top .maj{font-size:12px;color:var(--mute)}
.top .tt{flex:1}
.rond{width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:var(--card);display:grid;place-items:center}
.rond svg{width:20px;height:20px}
.rond.tourne svg{animation:tour 1s linear infinite}
@keyframes tour{to{transform:rotate(360deg)}}
main{padding:0 14px}
.stats{display:flex;gap:8px;margin:2px 0 14px;flex-wrap:wrap}
.stat{flex:1 1 30%;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:10px 12px}
.stat b{display:block;font-size:22px;line-height:1.1}
.stat span{font-size:12px;color:var(--mute)}
.stat.g b{color:var(--gold)}.stat.f b{color:var(--ok)}
h2.sec{font-size:16px;margin:18px 2px 10px;display:flex;align-items:center;gap:8px}
h2.sec small{color:var(--mute);font-weight:500}
.hero{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;padding:4px 2px 10px;margin:0 -14px;padding-inline:14px}
.hero::-webkit-scrollbar{display:none}
.hcard{flex:0 0 82%;scroll-snap-align:start;position:relative;border-radius:22px;padding:18px;min-height:170px;overflow:hidden;background:linear-gradient(150deg,var(--pc),#120a24 80%);border:2px solid var(--gold);box-shadow:0 0 0 1px #000,0 0 24px color-mix(in srgb,var(--gold) 45%,transparent);animation:lueur 2.4s ease-in-out infinite}
@keyframes lueur{50%{box-shadow:0 0 0 1px #000,0 0 38px color-mix(in srgb,var(--gold) 75%,transparent)}}
.hcard::after{content:"";position:absolute;inset:-40% -60%;background:linear-gradient(105deg,transparent 40%,rgba(255,255,255,.22) 50%,transparent 60%);animation:brille 3.5s ease-in-out infinite}
@keyframes brille{from{transform:translateX(-60%)}to{transform:translateX(60%)}}
.hcard .lg{display:inline-block;background:var(--gold);color:#1a1200;font-weight:900;font-size:11px;letter-spacing:1px;padding:4px 9px;border-radius:99px}
.hcard h3{font-size:22px;line-height:1.15;margin:12px 0 6px;font-weight:900}
.hcard p{margin:0;font-size:13px;opacity:.9;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.hcard .bas{display:flex;gap:8px;align-items:center;margin-top:12px;flex-wrap:wrap;position:relative;z-index:1}
.chips{display:flex;gap:8px;overflow-x:auto;margin:0 -14px 8px;padding:2px 14px 6px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:var(--card);border-radius:99px;padding:8px 14px;font-size:13px;font-weight:600;white-space:nowrap}
.chip.on{background:var(--acc);border-color:var(--acc);color:#05050c;box-shadow:0 0 14px color-mix(in srgb,var(--acc) 60%,transparent)}
.chip i{font-style:normal;opacity:.65;margin-left:4px}
.ligne{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:6px 2px 10px;color:var(--mute);font-size:13px}
.switch{position:relative;width:46px;height:28px;flex:none}
.switch input{opacity:0;position:absolute;inset:0;margin:0;z-index:1}
.switch span{position:absolute;inset:0;border-radius:99px;background:var(--line);transition:.2s}
.switch span::after{content:"";position:absolute;width:22px;height:22px;top:3px;left:3px;border-radius:50%;background:#fff;transition:.2s}
.switch input:checked+span{background:var(--acc)}
.switch input:checked+span::after{transform:translateX(18px)}
.liste{display:grid;gap:12px}
.card{position:relative;display:flex;flex-direction:column;border-radius:18px;background:var(--card);border:1px solid var(--line);overflow:hidden;border-left:4px solid var(--rc)}
.card.r-leg{--rc:var(--gold);box-shadow:0 0 18px color-mix(in srgb,var(--gold) 30%,transparent)}
.card.r-epi{--rc:var(--epi)}.card.r-rar{--rc:var(--rar)}.card.r-com{--rc:var(--com)}
.card.vu{opacity:.55}
.bande{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:7px 12px;background:linear-gradient(90deg,var(--pc),transparent);font-size:11px;font-weight:800;letter-spacing:1px;text-transform:uppercase}
.bande .rr{color:var(--rc)}
.corps{display:flex;gap:12px;padding:12px}
.emo{flex:none;width:54px;height:54px;border-radius:14px;display:grid;place-items:center;font-size:28px;background:color-mix(in srgb,var(--pc) 30%,var(--bg2))}
.txt{flex:1}
.txt h3{margin:0 0 3px;font-size:16px;line-height:1.25}
.txt p{margin:0;color:var(--mute);font-size:13px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.pied{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:0 12px 12px}
.free{background:var(--ok);color:#022;font-weight:900;font-size:11px;letter-spacing:.5px;padding:4px 8px;border-radius:8px}
.cond{background:color-mix(in srgb,var(--acc2) 25%,transparent);color:#ffc6f1;font-weight:700;font-size:11px;padding:4px 8px;border-radius:8px}
.neuf{background:var(--acc2);color:#fff;font-weight:900;font-size:10px;letter-spacing:1px;padding:3px 7px;border-radius:6px}
.timer{font-size:12px;color:#ffd38a;font-weight:700}
.timer.urg{color:#ff5b6e}
.prix{margin-left:auto;display:flex;align-items:center;gap:6px;font-weight:900}
.prix s{color:var(--mute);font-weight:500;font-size:12px}
.prix .z{background:#1f8f3a;color:#fff;padding:3px 8px;border-radius:8px;font-size:13px}
.prix .p{background:#8a5a12;color:#fff;padding:3px 8px;border-radius:8px;font-size:13px}
.coche{position:absolute;top:6px;right:8px;font-size:11px;font-weight:800;color:var(--ok)}
.vide{text-align:center;color:var(--mute);padding:40px 20px;border:1px dashed var(--line);border-radius:18px}
.vide b{display:block;color:var(--ink);font-size:17px;margin-bottom:6px}
nav.tabs{position:fixed;left:10px;right:10px;bottom:10px;z-index:6;display:grid;grid-template-columns:repeat(4,1fr);background:color-mix(in srgb,var(--bg2) 92%,transparent);backdrop-filter:blur(12px);border:1px solid var(--line);border-radius:22px;padding:6px}
nav.tabs button{position:relative;border:0;background:none;padding:8px 2px 6px;border-radius:16px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;font-weight:700;color:var(--mute)}
nav.tabs button svg{width:24px;height:24px}
nav.tabs button.on{color:var(--acc);background:color-mix(in srgb,var(--acc) 12%,transparent)}
nav.tabs .bdg{position:absolute;top:3px;right:calc(50% - 22px);background:var(--acc2);color:#fff;font-size:10px;font-weight:900;min-width:17px;height:17px;border-radius:9px;display:grid;place-items:center;padding:0 4px}
.voile{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:8;opacity:0;pointer-events:none;transition:.2s}
.voile.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:9;max-height:88vh;overflow:auto;background:var(--bg2);border-radius:24px 24px 0 0;border-top:2px solid var(--rc,var(--acc));transform:translateY(105%);transition:transform .25s ease;padding:10px 18px 26px}
.sheet.on{transform:none}
.poignee{width:44px;height:5px;border-radius:3px;background:var(--line);margin:4px auto 12px}
.sheet h2{margin:8px 0 6px;font-size:22px;line-height:1.2}
.sheet .desc{color:#d4d6f5;margin:0 0 12px}
.bloc{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px 14px;margin:10px 0}
.bloc h4{margin:0 0 6px;font-size:14px}
.bloc ul,.bloc ol{margin:0;padding-left:20px}
.bloc li{margin:3px 0}
.infos{display:grid;grid-template-columns:auto 1fr;gap:6px 12px;font-size:13px}
.infos dt{color:var(--mute)}.infos dd{margin:0;font-weight:600}
.gros{display:block;width:100%;border:0;border-radius:16px;padding:16px;font-size:17px;font-weight:900;background:linear-gradient(90deg,var(--acc),var(--acc2));color:#05050c;margin-top:14px;box-shadow:0 0 22px color-mix(in srgb,var(--acc) 45%,transparent)}
.second{display:block;width:100%;border:1px solid var(--line);border-radius:16px;padding:14px;font-weight:700;background:var(--card);margin-top:10px}
.reg{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:6px 14px;margin:0 0 14px}
.reg h3{margin:10px 0 4px;font-size:15px}
.rl{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:11px 0;border-top:1px solid var(--line)}
.rl:first-of-type{border-top:0}
.rl label{flex:1}
.rl small{display:block;color:var(--mute);font-size:12px}
.rl input[type=time],.rl select{background:var(--bg2);border:1px solid var(--line);border-radius:12px;padding:9px 10px;font-size:16px}
.couleurs{display:flex;gap:10px;flex-wrap:wrap;padding:10px 0}
.couleurs button{width:40px;height:40px;border-radius:50%;border:3px solid transparent}
.couleurs button.on{border-color:#fff}
.note{font-size:13px;color:var(--mute);padding:10px 0}
.toast{position:fixed;left:50%;bottom:96px;transform:translate(-50%,20px);background:#fff;color:#05050c;font-weight:700;padding:10px 16px;border-radius:12px;opacity:0;transition:.25s;z-index:10;pointer-events:none;white-space:nowrap}
.toast.on{opacity:1;transform:translate(-50%,0)}
@media (prefers-reduced-motion:reduce){.hcard,.hcard::after{animation:none}}
</style>
</head>
<body>
<header class="top">
  <svg class="logo" viewBox="0 0 108 108" aria-hidden="true"><circle cx="54" cy="54" r="40" fill="#140a2a"/><path d="M34 50v-6q0-10 20-10t20 10v6z" fill="#ff2bd6"/><path d="M33 50h42v26q0 2-2 2H35q-2 0-2-2z" fill="#00f0ff"/><path d="M33 55h42v4H33z" fill="#140a2a"/><path d="M49 52h10v12H49z" fill="#ffc93c"/><path d="M72 26l2 6 6 2-6 2-2 6-2-6-6-2 6-2z" fill="#ffc93c"/></svg>
  <div class="tt"><h1 id="nom">Mes <b>gratuits</b></h1><div class="maj" id="maj">Chargement…</div></div>
  <button class="rond" id="btnMaj" aria-label="Actualiser"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M20 12a8 8 0 1 1-2.3-5.6M20 4v5h-5"/></svg></button>
</header>

<main id="vue"></main>

<nav class="tabs" id="tabs">
  <button data-t="jeux"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M7 7h10a5 5 0 0 1 0 10c-1.6 0-2.4-1-3.2-2h-3.6c-.8 1-1.6 2-3.2 2A5 5 0 0 1 7 7zm-.5 3v1.5H5V13h1.5v1.5H8V13h1.5v-1.5H8V10zm9.5 1a1 1 0 1 0 0 2 1 1 0 0 0 0-2zm2-1.5a1 1 0 1 0 0 2 1 1 0 0 0 0-2z"/></svg>Jeux<span class="bdg" hidden></span></button>
  <button data-t="dlc"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M4 9h16v3H4zm1 4h6v8H6a1 1 0 0 1-1-1zm8 0h6v7a1 1 0 0 1-1 1h-5zM11 9h2v12h-2zM12 8c-1.5-3-5-3.5-5-1.5S10 8 12 8zm0 0c1.5-3 5-3.5 5-1.5S14 8 12 8z"/></svg>DLC<span class="bdg" hidden></span></button>
  <button data-t="produits"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M3 7l9-4 9 4v10l-9 4-9-4zm9 6.2L19 10V8.3l-7 3.1-7-3.1V10z"/></svg>Produits<span class="bdg" hidden></span></button>
  <button data-t="reglages"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 8.5a3.5 3.5 0 1 1 0 7 3.5 3.5 0 0 1 0-7zM10.3 2h3.4l.5 2.6 1.8.8 2.2-1.5 2.4 2.4-1.5 2.2.8 1.8 2.6.5v3.4l-2.6.5-.8 1.8 1.5 2.2-2.4 2.4-2.2-1.5-1.8.8-.5 2.6h-3.4l-.5-2.6-1.8-.8-2.2 1.5-2.4-2.4 1.5-2.2-.8-1.8L2 13.7v-3.4l2.6-.5.8-1.8-1.5-2.2 2.4-2.4 2.2 1.5 1.8-.8z"/></svg>Réglages</button>
</nav>

<div class="voile" id="voile"></div>
<div class="sheet" id="sheet"></div>
<div class="toast" id="toast"></div>

<script>
{
const BASE = 'https://raw.githubusercontent.com/Skuff6/mes-gratuits/main/data/';
const AND = !!(window.Android && window.Android.estAndroid);
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const lsGet = (k, d) => { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch (e) { return d; } };
const lsSet = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} };

const PLAT = {steam:['Steam','#1b9fff'],epic:['Epic Games','#5d5d6e'],gog:['GOG','#a64ce6'],prime:['Prime Gaming','#00a8e1'],ubi:['Ubisoft','#0070ff'],ea:['EA','#ff4747'],bnet:['Battle.net','#148eff'],xbox:['Xbox / PC','#16a116'],itch:['itch.io','#fa5c5c'],humble:['Humble','#cc2929'],gala:['IndieGala','#e5172f'],fanat:['Fanatical','#ff9800'],stove:['STOVE','#ff6b00'],riot:['Riot','#d13639'],rock:['Rockstar','#e0a100'],autre:['Autre','#6b6f99']};
const RAY = {bouffe:['Bouffe','🍔','#ff8a1f'],box:['Box du monde','🌍','#ffb703'],alcool:['Alcool','🍷','#b0174f'],beaute:['Beauté','💄','#ff4fa3'],homme:['Homme','🧔','#3a5bd9'],vetements:['Vêtements','👕','#00bcd4'],hygiene:['Hygiène & maison','🧴','#19c3b5'],animaux:['Animaux','🐾','#7cb342'],colis:['Colis & cadeaux','📦','#c9935a'],abo:['Abonnements','🎧','#8a5cff'],promo:['Promos','🏷️','#e53935']};
const CATJ = {jeu:['À garder','🎮'],cle:['Clés','🔑'],beta:['Bêtas & playtests','🧪'],essai:['À essayer','⏱️'],avenir:['À venir','📅']};
const CATD = {dlc:['DLC offerts','🧩'],code:['Codes en jeu','🎟️'],pack:['Packs & objets','🎒']};
const RANG = {leg:3,epi:2,rar:1,com:0};
const NOMR = {jeux:{leg:'Légendaire',epi:'Épique',rar:'Rare',com:'Commun'},produits:{leg:'💎 Pépite',epi:'⭐ Rare',rar:'👍 Bon plan',com:'Classique'}};
const ACCENTS = [['#00f0ff','#ff2bd6'],['#ff2bd6','#7c4dff'],['#ffc93c','#ff5b2e'],['#2ef59a','#00b4ff'],['#b56cff','#00f0ff'],['#ff4757','#ffc93c']];

const DEF = {notif:true, heure:'13:30', nJeux:true, nDlc:true, nProd:true, nRarete:'com', masquerVus:false, accent:null, rayonsOff:[]};
let R = Object.assign({}, DEF, lsGet('mg-reglages', {}));
let vus = new Set(lsGet('mg-vus', []));
let D = {jeux: lsGet('mg-c-jeux', null), produits: lsGet('mg-c-produits', null), theme: lsGet('mg-c-theme', null)};
let onglet = (location.hash || '#jeux').slice(1);
let filtre = {jeux:'tout', dlc:'tout', produits:'tout'};
let plat = {jeux:'tout', dlc:'tout'};
let horsLigne = false;

function toast(t) { const e = $('#toast'); e.textContent = t; e.classList.add('on'); clearTimeout(toast.t); toast.t = setTimeout(() => e.classList.remove('on'), 2200); }
function appliquerTheme() {
  const a = R.accent || (D.theme && D.theme.accent ? [D.theme.accent, D.theme.accent2 || '#ff2bd6'] : ACCENTS[0]);
  document.documentElement.style.setProperty('--acc', a[0]);
  document.documentElement.style.setProperty('--acc2', a[1]);
}
function envoyerNotif() {
  if (!AND) return;
  const [h, m] = (R.heure || '13:30').split(':').map(Number);
  try { window.Android.reglerNotif(!!R.notif, h || 0, m || 0, JSON.stringify({jeux:R.nJeux, dlc:R.nDlc, produits:R.nProd, rarete:R.nRarete})); } catch (e) {}
}
function sauver() { lsSet('mg-reglages', R); envoyerNotif(); }

function offres(t) {
  const now = Date.now();
  let src = t === 'produits' ? (D.produits?.offres || []) : (D.jeux?.offres || []);
  src = src.filter(o => !o.fin || new Date(o.fin).getTime() > now);
  if (t === 'jeux') src = src.filter(o => !CATD[o.cat]);
  if (t === 'dlc') src = src.filter(o => CATD[o.cat]);
  if (t === 'produits') src = src.filter(o => !R.rayonsOff.includes(o.rayon));
  return src.map(o => Object.assign({}, o, {_k: t + ':' + o.id})).sort((a, b) =>
    (RANG[b.rarete] || 0) - (RANG[a.rarete] || 0) || (b.gratuit === true) - (a.gratuit === true) || (b.nouveau === true) - (a.nouveau === true) ||
    (a.fin ? new Date(a.fin) : 9e15) - (b.fin ? new Date(b.fin) : 9e15));
}
function rebours(fin) {
  if (!fin) return '';
  const ms = new Date(fin) - Date.now();
  if (isNaN(ms) || ms <= 0) return '';
  const h = Math.floor(ms / 36e5), j = Math.floor(h / 24);
  const t = j >= 1 ? `${j} j ${h % 24} h` : h >= 1 ? `${h} h` : `${Math.max(1, Math.floor(ms / 6e4))} min`;
  return `<span class="timer${h < 48 ? ' urg' : ''}">⏳ Fin dans ${t}</span>`;
}
function couleur(t, o) { return t === 'produits' ? (RAY[o.rayon]?.[2] || '#6b6f99') : (PLAT[o.plateforme]?.[1] || '#6b6f99'); }
function nomRar(t, r) { return (t === 'produits' ? NOMR.produits : NOMR.jeux)[r] || ''; }

function carte(t, o) {
  const vu = vus.has(o._k);
  const haut = t === 'produits' ? (RAY[o.rayon]?.[0] || 'Divers') : (PLAT[o.plateforme]?.[0] || o.plateforme || 'Autre') + (o.via ? ' · via ' + o.via : '');
  const emo = t === 'produits' ? (o.emoji || RAY[o.rayon]?.[1] || '🎁') : (o.emoji || (CATJ[o.cat] || CATD[o.cat] || ['', '🎮'])[1]);
  const prix = t === 'produits'
    ? (o.gratuit || !o.cout || /^0/.test(o.cout) ? '<span class="z">0,00 €</span>' : `<span class="p">${esc(o.cout)}</span>`)
    : (o.prix ? `<s>${esc(o.prix)}</s>` : '') + '<span class="z">0 €</span>';
  return `<article class="card r-${o.rarete || 'com'}${vu ? ' vu' : ''}" style="--pc:${couleur(t, o)}" data-k="${esc(o._k)}">
    <div class="bande"><span>${esc(haut)}</span><span class="rr">${nomRar(t, o.rarete)}</span></div>
    <div class="corps"><div class="emo">${esc(emo)}</div><div class="txt"><h3>${esc(o.titre)}</h3><p>${esc(o.desc)}</p></div></div>
    <div class="pied">${o.gratuit ? '<span class="free">100 % GRATUIT</span>' : o.conditions ? '<span class="cond">Avec condition</span>' : ''}${o.nouveau && !vu ? '<span class="neuf">NOUVEAU</span>' : ''}${rebours(o.fin)}<span class="prix">${prix}</span></div>
    ${vu ? '<span class="coche">✓ vu</span>' : ''}</article>`;
}
function heroCarte(t, o) {
  return `<div class="hcard" style="--pc:${couleur(t, o)}" data-k="${esc(o._k)}"><span class="lg">${t === 'produits' ? '💎 PÉPITE' : '⭐ LÉGENDAIRE'}</span>
    <h3>${esc(o.titre)}</h3><p>${esc(o.desc)}</p>
    <div class="bas">${o.gratuit ? '<span class="free">100 % GRATUIT</span>' : ''}${rebours(o.fin)}${o.prix ? `<span class="prix"><s>${esc(o.prix)}</s><span class="z">0 €</span></span>` : ''}</div></div>`;
}

function vueListe(t) {
  const tout = offres(t);
  const cats = t === 'jeux' ? CATJ : t === 'dlc' ? CATD : null;
  let liste = tout;
  const f = filtre[t];
  if (f !== 'tout') liste = liste.filter(o => t === 'produits' ? o.rayon === f : o.cat === f);
  if (t !== 'produits' && plat[t] !== 'tout') liste = liste.filter(o => o.plateforme === plat[t]);
  const legs = liste.filter(o => o.rarete === 'leg');
  const reste = liste.filter(o => o.rarete !== 'leg' && !(R.masquerVus && vus.has(o._k)));
  const nb = (arr, fn) => arr.filter(fn).length;

  let chips = `<button class="chip${f === 'tout' ? ' on' : ''}" data-f="tout">Tout<i>${tout.length}</i></button>`;
  if (cats) for (const k in cats) { const n = nb(tout, o => o.cat === k); if (n) chips += `<button class="chip${f === k ? ' on' : ''}" data-f="${k}">${cats[k][1]} ${cats[k][0]}<i>${n}</i></button>`; }
  else for (const k in RAY) { const n = nb(tout, o => o.rayon === k); if (n) chips += `<button class="chip${f === k ? ' on' : ''}" data-f="${k}">${RAY[k][1]} ${RAY[k][0]}<i>${n}</i></button>`; }
  let pchips = '';
  if (t !== 'produits') {
    const ps = [...new Set(tout.map(o => o.plateforme))].filter(Boolean);
    if (ps.length > 1) {
      pchips = `<div class="chips"><button class="chip${plat[t] === 'tout' ? ' on' : ''}" data-p="tout">Toutes plateformes</button>` +
        ps.map(p => `<button class="chip${plat[t] === p ? ' on' : ''}" data-p="${esc(p)}" style="${plat[t] === p ? '' : `border-color:${PLAT[p]?.[1] || ''}`}">${esc(PLAT[p]?.[0] || p)}<i>${nb(tout, o => o.plateforme === p)}</i></button>`).join('') + '</div>';
    }
  }
  const titres = {jeux:'Jeux gratuits', dlc:'DLC, codes & packs', produits:'Produits gratuits'};
  let h = `<div class="stats"><div class="stat"><b>${tout.length}</b><span>offres</span></div><div class="stat g"><b>${nb(tout, o => o.rarete === 'leg')}</b><span>${t === 'produits' ? 'pépites' : 'légendaires'}</span></div><div class="stat f"><b>${nb(tout, o => o.gratuit)}</b><span>100 % gratuites</span></div></div>`;
  h += `<div class="chips">${chips}</div>${pchips}`;
  h += `<div class="ligne"><span>Masquer ce que j'ai déjà vu</span><label class="switch"><input type="checkbox" id="mv" ${R.masquerVus ? 'checked' : ''}><span></span></label></div>`;
  if (legs.length) h += `<h2 class="sec">${t === 'produits' ? '💎 Les pépites' : '⭐ Légendaires'} <small>${legs.length}</small></h2><div class="hero">${legs.map(o => heroCarte(t, o)).join('')}</div>`;
  if (reste.length) h += `<h2 class="sec">${titres[t]} <small>${reste.length}</small></h2><div class="liste">${reste.map(o => carte(t, o)).join('')}</div>`;
  if (!tout.length) h += `<div class="vide"><b>${D.jeux || D.produits ? 'Rien pour le moment' : 'Pas encore de résultats'}</b>La recherche du jour arrive à 13 h. Tu seras prévenu.</div>`;
  else if (!legs.length && !reste.length) h += `<div class="vide"><b>Tout est vu ✓</b>Désactive « Masquer » pour tout revoir.</div>`;
  return h;
}

function vueReglages() {
  const sel = (v, opts) => opts.map(([k, n]) => `<option value="${k}" ${v === k ? 'selected' : ''}>${n}</option>`).join('');
  const sw = (id, v) => `<label class="switch"><input type="checkbox" data-r="${id}" ${v ? 'checked' : ''}><span></span></label>`;
  return `<h2 class="sec">⚙️ Réglages</h2>
  <section class="reg"><h3>🔔 Notifications</h3>
    <div class="rl"><label>Me prévenir chaque jour<small>Quand il y a du nouveau</small></label>${sw('notif', R.notif)}</div>
    <div class="rl"><label>Heure de la notification<small>La recherche de Claude se fait à 13 h : mets au moins 13 h 30</small></label><input type="time" id="heure" value="${esc(R.heure)}"></div>
    <div class="rl"><label>🎮 Nouveaux jeux</label>${sw('nJeux', R.nJeux)}</div>
    <div class="rl"><label>🧩 Nouveaux DLC & packs</label>${sw('nDlc', R.nDlc)}</div>
    <div class="rl"><label>🎁 Nouveaux produits</label>${sw('nProd', R.nProd)}</div>
    <div class="rl"><label>Seulement si c'est au moins…</label><select id="nRarete">${sel(R.nRarete, [['com', 'Tout'], ['rar', 'Rare et +'], ['epi', 'Épique et +'], ['leg', 'Légendaire seulement']])}</select></div>
    <button class="second" id="test">Tester la notification</button><div style="height:10px"></div>
  </section>
  <section class="reg"><h3>🎨 Couleurs de l'appli</h3>
    <div class="couleurs">${ACCENTS.map((a, i) => `<button data-c="${i}" class="${R.accent && R.accent[0] === a[0] ? 'on' : ''}" style="background:linear-gradient(135deg,${a[0]},${a[1]})" aria-label="Couleur ${i + 1}"></button>`).join('')}<button data-c="auto" class="${!R.accent ? 'on' : ''}" style="background:conic-gradient(#00f0ff,#ff2bd6,#ffc93c,#2ef59a,#00f0ff)" aria-label="Couleurs choisies par Claude"></button></div>
    <div class="note">La dernière pastille = les couleurs que Claude choisit pour toi.</div>
  </section>
  <section class="reg"><h3>🛒 Rayons affichés dans Produits</h3>
    ${Object.keys(RAY).map(k => `<div class="rl"><label>${RAY[k][1]} ${RAY[k][0]}</label><label class="switch"><input type="checkbox" data-ray="${k}" ${R.rayonsOff.includes(k) ? '' : 'checked'}><span></span></label></div>`).join('')}
  </section>
  <section class="reg"><h3>🤖 La recherche</h3>
    <div class="note">Chaque jour à 13 h, Claude fouille tout Internet et envoie les résultats ici. Pour changer l'heure de recherche, ajouter un thème ou changer le style de l'appli, dis-le simplement à Claude dans le projet « Recherche gratuite ».</div>
    <button class="second" data-lien="https://claude.ai">Ouvrir Claude</button>
    <button class="second" id="raz">Réinitialiser les « déjà vu »</button><div style="height:10px"></div>
  </section>`;
}

function badges() {
  document.querySelectorAll('#tabs button').forEach(b => {
    const t = b.dataset.t, bd = b.querySelector('.bdg');
    b.classList.toggle('on', t === onglet);
    if (!bd) return;
    const n = offres(t).filter(o => !vus.has(o._k)).length;
    bd.hidden = !n; bd.textContent = n > 99 ? '99+' : n;
  });
}
function rendre() {
  $('#vue').innerHTML = onglet === 'reglages' ? vueReglages() : vueListe(onglet);
  badges();
  const m = (D.jeux?.maj || D.produits?.maj);
  $('#maj').textContent = m ? 'Mis à jour ' + new Date(m).toLocaleString('fr-FR', {weekday:'short', day:'numeric', month:'short', hour:'2-digit', minute:'2-digit'}) + (horsLigne ? ' · hors ligne' : '') : (horsLigne ? 'Hors ligne' : 'En attente de la première recherche');
}

function ouvrirFiche(k) {
  const [t] = k.split(':');
  const o = offres(t).find(x => x._k === k);
  if (!o) return;
  vus.add(k); lsSet('mg-vus', [...vus]);
  const li = a => (a && a.length) ? `<ul>${a.map(x => `<li>${esc(x)}</li>`).join('')}</ul>` : '';
  const inf = [];
  if (t !== 'produits') inf.push(['Plateforme', (PLAT[o.plateforme]?.[0] || o.plateforme || '') + (o.via ? ' via ' + o.via : '')]);
  else inf.push(['Rayon', RAY[o.rayon]?.[0] || o.rayon]);
  if (o.prix) inf.push(['Prix normal', o.prix]);
  if (o.cout) inf.push(['Coût réel', o.cout]);
  if (o.qty) inf.push(['Quantité', o.qty]);
  if (o.fin) inf.push(['Fin', new Date(o.fin).toLocaleString('fr-FR', {weekday:'long', day:'numeric', month:'long', hour:'2-digit', minute:'2-digit'})]);
  if (o.fiabilite) inf.push(['Fiabilité', o.fiabilite]);
  const s = $('#sheet');
  s.style.setProperty('--rc', o.rarete === 'leg' ? 'var(--gold)' : `var(--${o.rarete || 'com'})`);
  s.innerHTML = `<div class="poignee"></div>
    <div class="pied" style="padding:0">${o.gratuit ? '<span class="free">100 % GRATUIT</span>' : o.conditions ? '<span class="cond">Avec condition</span>' : ''}<span class="neuf" style="background:var(--rc)">${nomRar(t, o.rarete)}</span>${rebours(o.fin)}</div>
    <h2>${esc(o.titre)}</h2><p class="desc">${esc(o.desc)}</p>
    <div class="bloc"><dl class="infos">${inf.map(([a, b]) => `<dt>${esc(a)}</dt><dd>${esc(b)}</dd>`).join('')}</dl></div>
    ${o.contenu?.length ? `<div class="bloc"><h4>📦 Ce que tu reçois</h4>${li(o.contenu)}</div>` : ''}
    ${o.etapes?.length ? `<div class="bloc"><h4>⚡ Comment l'avoir</h4><ol>${o.etapes.map(x => `<li>${esc(x)}</li>`).join('')}</ol></div>` : ''}
    ${(o.conditions || o.pieges?.length) ? `<div class="bloc"><h4>⚠️ Les trucs cachés</h4>${o.conditions ? `<p style="margin:0 0 6px">${esc(o.conditions)}</p>` : ''}${li(o.pieges)}</div>` : ''}
    ${o.avis ? `<div class="bloc"><h4>💬 L'avis de Claude</h4><p style="margin:0">${esc(o.avis)}</p></div>` : ''}
    ${o.lien ? `<button class="gros" data-lien="${esc(o.lien)}">${t === 'produits' ? 'Je le veux 🎁' : 'Récupérer 🎮'}</button>` : ''}
    <button class="second" id="fermer">Fermer</button>`;
  s.classList.add('on'); $('#voile').classList.add('on'); s.scrollTop = 0;
}
function fermerFiche() { $('#sheet').classList.remove('on'); $('#voile').classList.remove('on'); rendre(); }
function ouvrirLien(u) { if (AND) window.Android.ouvrirLien(u); else window.open(u, '_blank'); }

async function charger(f) {
  const r = await fetch(BASE + f + '?t=' + Date.now(), {cache: 'no-store'});
  if (!r.ok) throw new Error(r.status);
  return r.json();
}
async function actualiser(montrer) {
  const b = $('#btnMaj'); b.classList.add('tourne');
  const res = await Promise.allSettled([charger('jeux.json'), charger('produits.json'), charger('theme.json')]);
  horsLigne = res[0].status === 'rejected' && res[1].status === 'rejected';
  if (res[0].status === 'fulfilled') { D.jeux = res[0].value; lsSet('mg-c-jeux', D.jeux); }
  if (res[1].status === 'fulfilled') { D.produits = res[1].value; lsSet('mg-c-produits', D.produits); }
  if (res[2].status === 'fulfilled') { D.theme = res[2].value; lsSet('mg-c-theme', D.theme); }
  b.classList.remove('tourne');
  appliquerTheme();
  if (!$('#sheet').classList.contains('on')) rendre();
  if (montrer) toast(horsLigne ? 'Pas de connexion' : 'À jour ✓');
}

window.ouvrirOnglet = t => { onglet = t; location.hash = t; fermerFiche(); window.scrollTo(0, 0); };
window.actualiser = actualiser;
window.retour = () => {
  if ($('#sheet').classList.contains('on')) { fermerFiche(); return true; }
  if (onglet !== 'jeux') { window.ouvrirOnglet('jeux'); return true; }
  return false;
};

document.addEventListener('click', e => {
  const tab = e.target.closest('#tabs button'); if (tab) { window.ouvrirOnglet(tab.dataset.t); return; }
  const lien = e.target.closest('[data-lien]'); if (lien) { ouvrirLien(lien.dataset.lien); return; }
  const c = e.target.closest('[data-k]'); if (c) { ouvrirFiche(c.dataset.k); return; }
  const ch = e.target.closest('[data-f]'); if (ch) { filtre[onglet] = ch.dataset.f; rendre(); return; }
  const pc = e.target.closest('[data-p]'); if (pc) { plat[onglet] = pc.dataset.p; rendre(); return; }
  const co = e.target.closest('[data-c]'); if (co) { R.accent = co.dataset.c === 'auto' ? null : ACCENTS[+co.dataset.c]; sauver(); appliquerTheme(); rendre(); return; }
  if (e.target.closest('#fermer') || e.target.id === 'voile') { fermerFiche(); return; }
  if (e.target.closest('#btnMaj')) { actualiser(true); return; }
  if (e.target.closest('#test')) { if (AND) { window.Android.testerNotif(); toast('Notification envoyée'); } else toast('Marche dans l\'appli sur le téléphone'); return; }
  if (e.target.closest('#raz')) { vus = new Set(); lsSet('mg-vus', []); toast('C\'est remis à zéro'); rendre(); }
});
document.addEventListener('change', e => {
  const t = e.target;
  if (t.id === 'mv') { R.masquerVus = t.checked; sauver(); rendre(); }
  else if (t.dataset.r) { R[t.dataset.r] = t.checked; sauver(); toast('Enregistré ✓'); }
  else if (t.id === 'heure') { R.heure = t.value || '13:30'; sauver(); toast('Notification à ' + R.heure.replace(':', ' h ')); }
  else if (t.id === 'nRarete') { R.nRarete = t.value; sauver(); toast('Enregistré ✓'); }
  else if (t.dataset.ray) { const k = t.dataset.ray; R.rayonsOff = t.checked ? R.rayonsOff.filter(x => x !== k) : [...R.rayonsOff, k]; sauver(); }
});
window.addEventListener('hashchange', () => { const t = location.hash.slice(1); if (t && t !== onglet) { onglet = t; rendre(); } });
document.addEventListener('visibilitychange', () => { if (!document.hidden) rendre(); });

if (!['jeux', 'dlc', 'produits', 'reglages'].includes(onglet)) onglet = 'jeux';
appliquerTheme();
rendre();
envoyerNotif();
actualiser(false);
setInterval(() => { if (!$('#sheet').classList.contains('on')) badges(); }, 60000);
}
</script>
</body>
</html>
