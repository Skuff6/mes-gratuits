<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Les Tréfonds d'Internet</title>
<style>
/* Version 2 : léger et rapide (pas de flou, pas d'animation en boucle), 2 grandes catégories */
:root{--bg:#0b0b14;--bg2:#12121f;--card:#171728;--card2:#1e1e33;--line:#2a2a44;--ink:#f3f4ff;--mute:#9b9dc0;--acc:#22d3ee;--acc2:#a855f7;--gold:#fbbf24;--epi:#a855f7;--rar:#3b82f6;--com:#64748b;--ok:#22c55e;--warn:#f59e0b;--bad:#ef4444}
body[data-o=offres]{--acc:#fb923c;--acc2:#ec4899}
body[data-o=favoris]{--acc:#f472b6;--acc2:#fb7185}
[hidden]{display:none!important}
*{box-sizing:border-box;min-width:0;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.4 system-ui,Roboto,sans-serif}
body{padding-bottom:76px}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
.haut{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
.l1{display:flex;align-items:center;gap:10px;padding:12px 14px 8px}
.l1 h1{margin:0;font-size:20px;font-weight:900;flex:1;line-height:1.1}
.l1 h1 span{color:var(--acc)}
.l1 .maj{display:block;font-size:11px;color:var(--mute);font-weight:500;margin-top:2px}
.ico{width:42px;height:42px;border-radius:12px;border:1px solid var(--line);background:var(--card);display:grid;place-items:center;position:relative;flex:none}
.ico svg{width:20px;height:20px}
.ico.tourne svg{animation:tour .8s linear infinite}
@keyframes tour{to{transform:rotate(360deg)}}
.ico .nb{position:absolute;top:-5px;right:-5px;background:var(--acc);color:#000;font-size:10px;font-weight:900;border-radius:9px;min-width:18px;height:18px;display:grid;place-items:center;padding:0 4px}
.l2{display:flex;gap:8px;padding:0 14px 8px}
.rech{flex:1;display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:0 12px;height:42px}
.rech input{flex:1;border:0;background:none;outline:none;font-size:16px}
.rech svg{width:18px;height:18px;color:var(--mute);flex:none}
.chips{display:flex;gap:6px;overflow-x:auto;padding:0 14px 10px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;height:34px;padding:0 12px;border-radius:10px;border:1px solid var(--line);background:var(--card);font-size:13px;font-weight:600;white-space:nowrap;display:flex;align-items:center;gap:5px}
.chip i{font-style:normal;color:var(--mute);font-size:12px}
.chip.on{background:var(--acc);border-color:var(--acc);color:#000}
.chip.on i{color:#000;opacity:.6}
.chip.a.on{background:var(--ac);border-color:var(--ac)}
.grp{display:flex;gap:10px;align-items:flex-start;margin:18px 0 8px;padding:10px 12px;border-radius:12px;background:color-mix(in srgb,var(--ac) 12%,transparent);border-left:4px solid var(--ac)}
.grp b{display:block;font-size:15px}
.grp small{color:var(--mute);font-size:12px}
.grp .n{margin-left:auto;font-weight:900;color:var(--ac)}
.b.a{background:var(--ac);color:#06060c}
main{padding:12px 14px}
.resume{display:flex;justify-content:space-between;align-items:center;font-size:13px;color:var(--mute);margin:0 0 10px}
.resume b{color:var(--ink)}
.resume select{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:6px 8px;font-size:13px}
.actifs{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 10px}
.actifs button{border:0;background:color-mix(in srgb,var(--acc) 18%,transparent);color:var(--acc);border-radius:8px;padding:5px 9px;font-size:12px;font-weight:700}
h2.sec{font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--mute);margin:16px 0 8px;font-weight:800}
.top{display:flex;gap:10px;overflow-x:auto;margin:0 -14px;padding:0 14px 4px;scrollbar-width:none}
.top::-webkit-scrollbar{display:none}
.tc{flex:0 0 72%;max-width:300px;border-radius:16px;padding:14px;background:linear-gradient(160deg,color-mix(in srgb,var(--pc) 55%,#000) ,var(--card) 75%);border:1px solid color-mix(in srgb,var(--rc) 70%,transparent)}
.tc.r-leg{box-shadow:0 0 0 1px var(--gold) inset}
.tc .rg{font-size:11px;font-weight:900;color:var(--rc);letter-spacing:.05em}
.tc h3{margin:6px 0 4px;font-size:17px;line-height:1.2;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.tc .mt{font-size:12px;color:#d6d8f5;display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.liste{display:flex;flex-direction:column;gap:8px}
.it{display:flex;gap:12px;align-items:center;padding:10px;border-radius:14px;background:var(--card);border:1px solid var(--line);position:relative}
.it::before{content:"";position:absolute;left:0;top:10px;bottom:10px;width:3px;border-radius:0 3px 3px 0;background:var(--rc)}
.it.vu{opacity:.5}
.r-leg{--rc:var(--gold)}.r-epi{--rc:var(--epi)}.r-rar{--rc:var(--rar)}.r-com{--rc:var(--com)}
.av{flex:none;width:48px;height:48px;border-radius:12px;display:grid;place-items:center;font-size:24px;background:color-mix(in srgb,var(--pc) 28%,var(--card2));color:#fff;font-weight:900}
.av.txt{font-size:12px;letter-spacing:.02em}
.ct{flex:1}
.ct h3{margin:0;font-size:15px;line-height:1.25;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.mt{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-top:4px;font-size:12px;color:var(--mute)}
.b{font-size:10.5px;font-weight:800;padding:2px 6px;border-radius:6px;white-space:nowrap}
.b.g{background:var(--ok);color:#03140a}
.b.c{background:color-mix(in srgb,var(--warn) 22%,transparent);color:var(--warn)}
.b.n{background:var(--acc2);color:#fff}
.b.r{color:var(--rc);border:1px solid color-mix(in srgb,var(--rc) 60%,transparent)}
.urg{color:var(--bad);font-weight:700}
.dr{flex:none;display:flex;flex-direction:column;align-items:flex-end;gap:6px}
.px{font-weight:900;font-size:13px;padding:4px 8px;border-radius:8px;background:#14532d;color:#bbf7d0;white-space:nowrap}
.px.p{background:#78350f;color:#fde68a}
.px s{opacity:.6;font-weight:500;margin-right:4px}
.fav{border:0;background:none;padding:2px;font-size:18px;line-height:1;opacity:.85}
.plus{display:block;width:100%;margin-top:10px;height:44px;border-radius:12px;border:1px dashed var(--line);background:none;color:var(--mute);font-weight:700}
.vide{text-align:center;color:var(--mute);padding:36px 16px;border:1px dashed var(--line);border-radius:16px}
.vide b{display:block;color:var(--ink);font-size:16px;margin-bottom:4px}
nav.bas{position:fixed;left:0;right:0;bottom:0;z-index:6;display:grid;grid-template-columns:repeat(4,1fr);background:var(--bg2);border-top:1px solid var(--line);padding:6px 6px calc(6px + env(safe-area-inset-bottom))}
nav.bas button{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0;border-radius:12px;font-size:11px;font-weight:700;color:var(--mute);position:relative}
nav.bas svg{width:23px;height:23px}
nav.bas button.on{color:var(--acc);background:color-mix(in srgb,var(--acc) 12%,transparent)}
nav.bas .nb{position:absolute;top:2px;left:calc(50% + 6px);background:var(--acc2);color:#fff;font-size:10px;font-weight:900;min-width:17px;height:17px;border-radius:9px;display:grid;place-items:center;padding:0 4px}
.voile{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:8;display:none}
.voile.on{display:block}
.feuille{position:fixed;left:0;right:0;bottom:0;z-index:9;max-height:90vh;overflow-y:auto;background:var(--bg2);border-radius:20px 20px 0 0;border-top:2px solid var(--acc);padding:8px 16px calc(20px + env(safe-area-inset-bottom));display:none}
.feuille.on{display:block}
.poi{width:40px;height:4px;border-radius:2px;background:var(--line);margin:4px auto 10px}
.feuille h2{margin:6px 0 6px;font-size:21px;line-height:1.2}
.feuille .d{color:#d4d6f2;margin:0 0 10px}
.bl{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 12px;margin:8px 0}
.bl h4{margin:0 0 6px;font-size:13px}
.bl ul,.bl ol{margin:0;padding-left:18px}.bl li{margin:3px 0}
.inf{display:grid;grid-template-columns:auto 1fr;gap:5px 12px;font-size:13px;margin:0}
.inf dt{color:var(--mute)}.inf dd{margin:0;font-weight:600}
.go{display:block;width:100%;height:52px;border:0;border-radius:14px;font-size:17px;font-weight:900;background:var(--acc);color:#000;margin-top:12px}
.sec2{display:block;width:100%;height:46px;border:1px solid var(--line);border-radius:14px;background:var(--card);font-weight:700;margin-top:8px}
.rang{display:flex;gap:8px}
.rang>*{flex:1}
.fgrp{margin:12px 0}
.fgrp>b{display:block;font-size:12px;color:var(--mute);text-transform:uppercase;letter-spacing:.06em;margin-bottom:6px}
.fgrp .wrap{display:flex;flex-wrap:wrap;gap:6px}
.ligne{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 0;border-top:1px solid var(--line)}
.ligne:first-of-type{border-top:0}
.ligne small{display:block;color:var(--mute);font-size:12px}
.sw{position:relative;width:46px;height:28px;flex:none}
.sw input{position:absolute;inset:0;opacity:0;margin:0;z-index:1}
.sw span{position:absolute;inset:0;border-radius:14px;background:var(--line)}
.sw span::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:transform .15s}
.sw input:checked+span{background:var(--acc)}
.sw input:checked+span::after{transform:translateX(18px)}
.reg{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:4px 14px;margin:0 0 12px}
.reg h3{margin:10px 0 2px;font-size:15px}
.reg select,.reg input[type=time]{background:var(--bg2);border:1px solid var(--line);border-radius:10px;padding:8px;font-size:15px}
.note{font-size:13px;color:var(--mute);padding:8px 0 10px}
.coul{display:flex;gap:10px;flex-wrap:wrap;padding:10px 0}
.coul button{width:38px;height:38px;border-radius:50%;border:3px solid transparent}
.coul button.on{border-color:#fff}
.toast{position:fixed;left:50%;bottom:86px;transform:translateX(-50%);background:#fff;color:#000;font-weight:700;padding:9px 14px;border-radius:10px;z-index:10;display:none;white-space:nowrap}
.toast.on{display:block}
</style>
</head>

{

const PLAT = {steam:['Steam','#1b9fff','ST'],epic:['Epic Games','#64748b','EP'],gog:['GOG','#a64ce6','GOG'],prime:['Prime Gaming','#00a8e1','PR'],ubi:['Ubisoft','#0070ff','UBI'],ea:['EA','#ff4747','EA'],bnet:['Battle.net','#148eff','BN'],xbox:['Xbox / PC','#16a116','XB'],itch:['itch.io','#fa5c5c','IT'],humble:['Humble','#cc2929','HB'],gala:['IndieGala','#e5172f','IG'],fanat:['Fanatical','#ff9800','FN'],stove:['STOVE','#ff6b00','SV'],riot:['Riot','#d13639','RI'],rock:['Rockstar','#e0a100','R*'],android:['Android','#3ddc84','AND'],ios:['iPhone','#9ca3af','iOS'],ps:['PlayStation','#0070d1','PS'],switch:['Switch','#e60012','NS'],autre:['Autre','#64748b','🎮']};

  if (res[1].status === 'fulfilled') { D.produits = res[1].value; lsSet('mg-c-produits', D.produits); }
  if (res[2].status === 'fulfilled') { D.theme = res[2].value; lsSet('mg-c-theme', D.theme); }
  b.classList.remove('tourne');
  const change = avant !== JSON.stringify([D.jeux, D.produits]).length + (D.jeux?.maj || '') + (D.produits?.maj || '');
  if (change || montrer || horsLigne) { preparer(); if (!$('#feuille').classList.contains('on')) rendre(); }
  verifierVersion();
  if (montrer) toast(horsLigne ? 'Pas de connexion' : change ? 'Nouveaux résultats ✓' : 'Déjà à jour ✓');
}

async function verifierVersion() {
  if (!AND || !window.Android.versionApp) return;
  try {
    const r = await fetch('https://api.github.com/repos/Skuff6/mes-gratuits/releases/tags/appli', {cache: 'no-store'});
    if (!r.ok) return;
    const n = +(((await r.json()).body || '').match(/Version (\d+)/) || [])[1];
    $('#maj-appli').hidden = !(n && n > window.Android.versionApp());
  } catch (e) {}
}
window.ouvrirOnglet = t => { if (t === 'dlc') t = 'jeux'; if (t === 'produits') t = 'offres'; onglet = t; montres = PAS; history.replaceState(null, '', '#' + t); $('#feuille').classList.remove('on'); $('#voile').classList.remove('on'); rendre(); window.scrollTo(0, 0); };
window.actualiser = actualiser;
window.retour = () => {
  if ($('#feuille').classList.contains('on')) { fermer(); return true; }
  if (q) { q = ''; $('#q').value = ''; rendre(); return true; }
  if (onglet !== 'jeux') { window.ouvrirOnglet('jeux'); return true; }
  return false;
};

document.addEventListener('click', e => {
  const g = s => e.target.closest(s);
  let el;
  if ((el = g('#nav button'))) return window.ouvrirOnglet(el.dataset.t);
  if ((el = g('[data-fav]'))) { const k = el.dataset.fav; if (favs[k]) delete favs[k]; else favs[k] = 1; lsSet('mg-favs', favs); toast(favs[k] ? 'Ajouté aux favoris ❤️' : 'Retiré des favoris'); if ($('#feuille').classList.contains('on')) fiche(k); else rendre(); return; }
  if ((el = g('[data-lien]'))) return lien(el.dataset.lien);
  if ((el = g('[data-k]'))) return fiche(el.dataset.k);
  if ((el = g('[data-acc]'))) { F[onglet].acces = el.dataset.acc; montres = PAS; sauverF(); rendre(); window.scrollTo(0, 0); return; }
  if ((el = g('[data-cat]'))) { F[onglet].cat = el.dataset.cat; montres = PAS; sauverF(); rendre(); return; }
  if ((el = g('[data-fk]'))) { F[onglet][el.dataset.fk] = el.dataset.fv; montres = PAS; sauverF(); $('#feuille').innerHTML = vueFiltres(); return; }
  if ((el = g('[data-raz]'))) { const k = el.dataset.raz, d = F0(); if (k === 'tout') { const c = F[onglet].cat, tr = F[onglet].tri; F[onglet] = Object.assign(d, {cat: c, tri: tr}); } else F[onglet][k] = d[k]; sauverF(); if ($('#feuille').classList.contains('on')) $('#feuille').innerHTML = vueFiltres(); else rendre(); return; }
  if ((el = g('[data-c]'))) { R.accent = +el.dataset.c; sauver(); accent(); rendre(); return; }
  if (g('#btnFiltres')) { $('#feuille').innerHTML = vueFiltres(); ouvrirFeuille(); return; }
  if (g('#fermer') || e.target.id === 'voile') return fermer();
  if (g('#plus')) { montres += PAS; rendre(); return; }
  if (g('#btnMaj')) return actualiser(true);
  if (g('#test')) { if (AND) { window.Android.testerNotif(); toast('Notification envoyée'); } else toast('Marche dans l\'appli du téléphone'); return; }
  if (g('#raz')) { vus = new Set(); lsSet('mg-vus', []); toast('Remis à zéro'); rendre(); return; }
  if (g('#nettoyer')) { for (const k in favs) if (!cache.tout.get(k)) delete favs[k]; lsSet('mg-favs', favs); rendre(); }
});
document.addEventListener('change', e => {
  const t = e.target;
  if (t.dataset.fb) { F[onglet][t.dataset.fb] = t.checked; montres = PAS; sauverF(); $('#feuille').innerHTML = vueFiltres(); }
  else if (t.id === 'tri') { F[onglet].tri = t.value; sauverF(); rendre(); }
  else if (t.dataset.r) { R[t.dataset.r] = t.checked; sauver(); toast('Enregistré ✓'); }
  else if (t.id === 'heure') { R.heure = t.value || '13:30'; sauver(); toast('Notification à ' + R.heure.replace(':', ' h ')); }
  else if (t.id === 'nRarete') { R.nRarete = t.value; sauver(); toast('Enregistré ✓'); }
});
let tq;
$('#q').addEventListener('input', e => { clearTimeout(tq); tq = setTimeout(() => { q = e.target.value; montres = PAS; $('#vue').innerHTML = vueListe(onglet); }, 180); });
document.addEventListener('visibilitychange', () => { if (!document.hidden) actualiser(false); });

if (!['jeux', 'offres', 'favoris', 'reglages'].includes(onglet)) onglet = 'jeux';
accent();
preparer();
rendre();
envoyerNotif();
actualiser(false);
}
</script>
</body>
