name: Fabriquer l'appli

on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'build.gradle'
      - 'settings.gradle'
      - 'gradle.properties'
      - '.github/workflows/build.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Construire l'APK
        run: gradle assembleRelease --no-daemon -PversionCode=${{ github.run_number }}

      - name: Renommer
        run: cp app/build/outputs/apk/release/app-release.apk mes-gratuits.apk

      - name: Publier le fichier à télécharger
        uses: softprops/action-gh-release@v2
        with:
          tag_name: appli
          name: Les Tréfonds d'Internet — dernière version
          body: |
            Version ${{ github.run_number }}.
            Sur ton téléphone, télécharge **mes-gratuits.apk** ci-dessous, ouvre-le et touche « Installer ».
          files: mes-gratuits.apk
          make_latest: true
